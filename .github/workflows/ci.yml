# Sibling checkout: file:../dsh-webpage/packages/webpage requires dsh-webpage as a
# peer under $GITHUB_WORKSPACE. No dsh-app-check checkout is needed (inline checker).
# After npm publication, replace the file: webpage dep with a registry version and drop
# the dsh-webpage checkout step below.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: dsh-automations-app

      - name: Checkout dsh-webpage
        uses: actions/checkout@v4
        with:
          repository: dshapps/dsh-webpage
          path: dsh-webpage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Build webpage dependency
        working-directory: dsh-webpage
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install
        working-directory: dsh-automations-app
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: dsh-automations-app
        run: pnpm run typecheck

      - name: Unit tests
        working-directory: dsh-automations-app
        run: pnpm run test:unit

      - name: Lint
        working-directory: dsh-automations-app
        run: pnpm run lint

      - name: Build
        working-directory: dsh-automations-app
        run: pnpm run build

      - name: Pack verify
        working-directory: dsh-automations-app
        run: pnpm run pack:verify
